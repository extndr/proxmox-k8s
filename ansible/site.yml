---
- name: Prepare Kubernetes nodes
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for hosts to become reachable
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Gather facts after SSH is reachable
      ansible.builtin.setup:
  roles:
    - common
    - containerd
    - kubernetes

- name: Bootstrap control plane
  hosts: control_plane
  become: true
  gather_facts: false
  roles:
    - control_plane

- name: Join worker nodes
  hosts: workers
  become: true
  gather_facts: false
  roles:
    - worker

- name: Bootstrap cluster networking
  hosts: control_plane
  become: true
  gather_facts: false
  roles:
    - cni
