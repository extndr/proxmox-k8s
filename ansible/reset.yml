---
- name: Reset Kubernetes state on all nodes
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Check whether this node belongs to a kubeadm cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubeadm_state

    - name: Reset kubeadm state
      ansible.builtin.command:
        cmd: kubeadm reset --force
      when: kubeadm_state.stat.exists
      changed_when: true

    - name: Remove CNI state left by kubeadm reset
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /var/lib/cni
