---
- name: Ensure Kubernetes APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"

- name: Configure Kubernetes package repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types:
      - deb
    uris:
      - "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/"
    suites:
      - "/"
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    state: present

- name: Refresh APT cache after configuring Kubernetes repository
  ansible.builtin.apt:
    update_cache: true
