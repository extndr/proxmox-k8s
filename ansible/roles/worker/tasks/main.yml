---
- name: Check whether worker is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: worker_kubelet_config

- name: Join worker to Kubernetes cluster
  no_log: true
  ansible.builtin.command:
    cmd: >-
      {{ hostvars[groups['control_plane'][0]].control_plane_kubeadm_join_command }}
      --node-name {{ inventory_hostname }}
      --cri-socket unix:///run/containerd/containerd.sock
  when: not worker_kubelet_config.stat.exists
  changed_when: true
