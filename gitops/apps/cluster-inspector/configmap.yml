---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-inspector
  namespace: demo
data:
  inspect.sh: |
    #!/bin/sh
    set -eu

    token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    api="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"

    curl --fail --silent --show-error \
      --connect-timeout 5 \
      --max-time 15 \
      --cacert "$ca" \
      --header "Authorization: Bearer $token" \
      "$api/api/v1/namespaces/$POD_NAMESPACE/pods" \
      >/dev/null

    echo "Kubernetes API access is allowed for pods in namespace $POD_NAMESPACE."
