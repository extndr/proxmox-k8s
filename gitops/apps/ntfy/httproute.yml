---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
  namespace: demo
  labels:
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/part-of: homelab
spec:
  parentRefs:
    - name: demo-gateway
      sectionName: ntfy
  hostnames:
    - ntfy.lab.home.arpa
  rules:
    - backendRefs:
        - name: ntfy
          port: 80
