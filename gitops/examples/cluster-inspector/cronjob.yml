---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-inspector
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cluster-inspector
        spec:
          restartPolicy: Never
          serviceAccountName: cluster-inspector
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: inspector
              image: curlimages/curl:8.21.0
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -eu

                  token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  api="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"

                  curl --fail --silent --show-error \
                    --connect-timeout 5 \
                    --max-time 15 \
                    --cacert "$ca" \
                    --header "Authorization: Bearer $token" \
                    "$api/api/v1/namespaces/$POD_NAMESPACE/pods" \
                    >/dev/null

                  echo "Kubernetes API access is allowed for pods in namespace $POD_NAMESPACE."
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL
