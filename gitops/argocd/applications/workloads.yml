---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/extndr/proxmox-k8s.git
        revision: HEAD
        directories:
          - path: gitops/apps/*
  template:
    metadata:
      name: '{{ .path.basenameNormalized }}'
      namespace: argocd
    spec:
      project: workloads
      source:
        repoURL: https://github.com/extndr/proxmox-k8s.git
        targetRevision: HEAD
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: demo
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - FailOnSharedResource=true
        retry:
          limit: 5
          refresh: true
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
