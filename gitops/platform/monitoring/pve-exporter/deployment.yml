---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pve-exporter
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: 10.10.10.1
          hostnames:
            - pve
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: prompve/prometheus-pve-exporter:3.10.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PVE_USER
              value: prometheus@pve
            - name: PVE_TOKEN_NAME
              value: monitoring
            - name: PVE_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: pve-exporter-credentials
                  key: token-value
            - name: PVE_VERIFY_SSL
              value: "true"
            - name: REQUESTS_CA_BUNDLE
              value: /etc/pve-ca/pve-root-ca.pem
            - name: TMPDIR
              value: /tmp
          ports:
            - name: http
              containerPort: 9221
          readinessProbe:
            httpGet:
              path: "/metrics"
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pve-ca
              mountPath: /etc/pve-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pve-ca
          configMap:
            name: pve-ca
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
