---
commonLabels:
  monitoring: platform

# kubeadm keeps these endpoints on loopback by default. Do not create
# permanently-down targets for components Prometheus cannot reach.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

# node-exporter requires host access, so only that subchart runs in
# kube-system instead of the restricted monitoring namespace.
prometheus-node-exporter:
  namespaceOverride: kube-system
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
  prometheus:
    monitor:
      enabled: true
      namespace: monitoring
      additionalLabels:
        monitoring: platform

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  prometheus:
    monitor:
      additionalLabels:
        monitoring: platform

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    replicas: 2
    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname

    retention: 7d
    retentionSize: 4GiB
    walCompression: true
    scrapeInterval: 10s
    evaluationInterval: 10s

    ruleSelectorNilUsesHelmValues: false
    ruleSelector:
      matchLabels:
        monitoring: platform
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        monitoring: platform
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector:
      matchLabels:
        monitoring: platform

    ruleNamespaceSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

alertmanager:
  service:
    type: ClusterIP
  # ntfy consumes Alertmanager's native webhook payload with its built-in
  # Alertmanager template. Delivery stays inside the cluster; no relay or
  # notification credentials are required.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - namespace
          - alertname
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - namespace
          - alertname
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - namespace
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      receiver: "null"

      group_by:
        - namespace
        - alertname

      # Root route defaults
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      # Severity-based routing with intentionally aggressive timings for this
      # experimental environment. Production environments should use more conservative
      # values to reduce notification noise.
      routes:
        - receiver: "null"
          matchers:
            - 'severity = "none"'

        - receiver: ntfy
          matchers:
            - 'severity = "critical"'
          group_wait: 3s
          group_interval: 30s
          repeat_interval: 30m

        - receiver: ntfy
          matchers:
            - 'severity = "warning"'
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 2h

        - receiver: ntfy
          matchers:
            - 'severity = "info"'
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h

    receivers:
      - name: "null"

      - name: ntfy
        webhook_configs:
          - send_resolved: true
            url: http://ntfy.demo.svc.cluster.local/homelab-alerts?template=alertmanager

    templates:
      - /etc/alertmanager/config/*.tmpl

  alertmanagerSpec:
    replicas: 2
    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  serviceMonitor:
    labels:
      monitoring: platform
  persistence:
    enabled: false
  testFramework:
    enabled: false
  initChownData:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
  grafana.ini:
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
