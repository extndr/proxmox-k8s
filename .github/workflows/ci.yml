---
name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  # Keep the default workflow read-only; publish elevates only what it needs.
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_APP_IMAGE: ghcr.io/extndr/proxmox-k8s-demo-app

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.2

      - name: Lint
        run: make lint

      - name: Validate
        run: make validate

      - name: Test
        run: make test

      - name: Scan
        run: make scan

      # PRs verify the image builds but never publish it.
      - name: Build demo app
        if: github.event_name == 'pull_request'
        run: docker build --tag demo-app:ci demo-app

  publish:
    name: Publish demo app
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.2
          install_args: kustomize

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DEMO_APP_IMAGE }}
          tags: |
            type=sha,format=long,priority=300
            type=raw,value=main,priority=200

      - name: Build and push demo app
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: demo-app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}

      # Promote the exact published image digest; Argo CD handles deployment.
      - name: Update GitOps image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        working-directory: gitops/workloads/demo-app
        run: |
          kustomize edit set image "demo-app=${DEMO_APP_IMAGE}@${IMAGE_DIGEST}"
          git diff --check

      - name: Commit GitOps update
        env:
          DEPLOY_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if git diff --quiet -- gitops/workloads/demo-app/kustomization.yml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/workloads/demo-app/kustomization.yml
          git commit -m "Update demo app image to ${DEPLOY_VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
