---
name: delivery

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

env:
  DEMO_APP_IMAGE: ghcr.io/extndr/proxmox-k8s-demo-app

jobs:
  deliver:
    name: Publish and promote demo app
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Delivery runs only after successful CI on main. Serialize promotions so an
    # older build cannot race a newer one into the GitOps manifest.
    concurrency:
      group: delivery-demo-app-main
      cancel-in-progress: false
      queue: max

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect demo app inputs
        id: changes
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if git rev-parse "${SOURCE_SHA}^" >/dev/null 2>&1 && \
            git diff --quiet "${SOURCE_SHA}^" "$SOURCE_SHA" -- demo-app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A delivery can wait behind another run. Unrelated main changes are safe;
      # newer demo-app inputs make this build stale and it must not be promoted.
      - name: Check delivery freshness
        id: freshness
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          if git diff --quiet "$SOURCE_SHA" origin/main -- demo-app/; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit changed demo-app inputs; skipping stale delivery."
          fi

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.freshness.outputs.current == 'true'
        with:
          version: 2026.8.2
          install_args: kustomize

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.freshness.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.freshness.outputs.current == 'true'

      - name: Docker metadata
        id: metadata
        if: steps.freshness.outputs.current == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DEMO_APP_IMAGE }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }},priority=300
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Build and push demo app
        id: build
        if: steps.freshness.outputs.current == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: demo-app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.event.workflow_run.head_sha }}

      - name: Update GitOps image digest
        if: steps.freshness.outputs.current == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        working-directory: gitops/workloads/demo-app
        run: |
          kustomize edit set image "demo-app=${DEMO_APP_IMAGE}@${IMAGE_DIGEST}"
          kustomize build . >/dev/null
          git diff --check

      - name: Commit GitOps update
        if: steps.freshness.outputs.current == 'true'
        env:
          DEPLOY_VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- gitops/workloads/demo-app/kustomization.yml; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/workloads/demo-app/kustomization.yml
          git commit -m "Update demo app image to ${DEPLOY_VERSION}"

          # main may advance while the image is building. Rebase across unrelated
          # changes, but never promote if newer demo-app inputs appeared.
          for attempt in 1 2 3; do
            git fetch origin main

            if ! git diff --quiet "$SOURCE_SHA" origin/main -- demo-app/; then
              echo "A newer commit changed demo-app inputs; skipping stale promotion."
              exit 0
            fi

            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced during push; retrying (${attempt}/3)..."
          done

          echo "Failed to publish GitOps update after 3 attempts." >&2
          exit 1
